[package]
name = "orbiv-migrator-source-redis"
version.workspace = true
edition = "2024"

[dependencies]
orbiv = { path = "../orbiv", version = "0.1.0"}

async-trait = "0.1.91"
redis = { version = "1.5.0", features = ["tokio-comp"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
